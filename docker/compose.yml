services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /media/daniel/1807-3D591/qdrant_storage:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:pg17
    user: "1000:1000"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb
    volumes:
      - /media/daniel/1807-3D591/pgvector_storage:/var/lib/postgresql/data
